name: BuildAndTest

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - 'release/*'
  pull_request:
  schedule:
    # Run this workflow at 6 PM UTC every Sunday
    - cron: "0 18 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  VERSION_FILE: 'src/Steeltoe.NetCoreTool.Templates.csproj'

jobs:
  build:
    name: Build and Test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          8.0.*
          9.0.*
          10.0.*

    - name: Git checkout
      uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Restore packages
      run: dotnet restore --verbosity minimal

    - name: Build solution
      run: dotnet build --no-restore --configuration Release --verbosity minimal

    - name: Test
      run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" --logger "GitHubActions;summary.includeSkippedTests=true"
